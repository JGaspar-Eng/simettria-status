<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIMETTRIA — Preview PR #526</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f5f7f9;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#bar{height:36px;display:flex;align-items:center;justify-content:center;background:#fff3cd;color:#664d03;border-bottom:1px solid #ffecb5;font-size:12px;font-weight:700;letter-spacing:.02em}
#frame{display:block;width:100%;height:calc(100% - 37px);border:0;visibility:hidden}
#error{display:none;padding:24px;color:#842029;background:#f8d7da;white-space:pre-wrap}
</style>
</head>
<body>
<div id="bar">PREVIEW VISUAL — PR #526 · HEAD a5ef20e · não é a versão publicada</div>
<div id="error"></div>
<iframe id="frame" src="index.html?preview=pr526"></iframe>
<script>
(async function(){
  const frame=document.getElementById('frame');
  const error=document.getElementById('error');
  function fail(e){error.style.display='block';error.textContent='Falha ao montar preview da PR #526:\n'+(e&&e.message?e.message:String(e));}
  function decodeGithubContent(payload){
    if(!payload || payload.encoding!=='base64' || !payload.content) throw new Error('conteúdo GitHub inválido');
    const bin=atob(payload.content.replace(/\s/g,''));
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
  }
  frame.addEventListener('load',async function(){
    try{
      const ref='a5ef20e702ce105fec8f02634cb01a5f375a9f0d';
      const api='https://api.github.com/repos/JGaspar-Eng/simettria/contents/docs/';
      const [statusResp,devResp,scriptResp]=await Promise.all([
        fetch('status.json?t='+Date.now(),{cache:'no-store'}),
        fetch(api+'DEVELOPMENT_STATUS.json?ref='+ref,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}}),
        fetch(api+'status_areas.js?ref='+ref,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}})
      ]);
      if(!statusResp.ok) throw new Error('status.json HTTP '+statusResp.status);
      if(!devResp.ok) throw new Error('DEVELOPMENT_STATUS.json da PR HTTP '+devResp.status);
      if(!scriptResp.ok) throw new Error('status_areas.js da PR HTTP '+scriptResp.status);
      const status=await statusResp.json();
      const dev=JSON.parse(decodeGithubContent(await devResp.json()));
      const codigo=decodeGithubContent(await scriptResp.json());
      status.development=status.development||{};
      status.development.execution=dev.execution;
      const currentArea=Number(status.development?.current?.area?.number);
      const activeAreas=new Set([currentArea]);
      (dev.execution?.active||[]).forEach(x=>{ if(x&&x.area!=null) activeAreas.add(Number(x.area)); });
      (status.development.epics||[]).forEach(epic=>{ epic.active=activeAreas.has(Number(epic.number)); });
      const doc=frame.contentDocument;
      const win=frame.contentWindow;
      const script=doc.createElement('script');
      script.textContent=codigo+'\n//# sourceURL=status_areas-pr526.js';
      doc.body.appendChild(script);
      await new Promise(r=>setTimeout(r,50));
      doc.dispatchEvent(new win.CustomEvent('simettria:status',{detail:status}));
      frame.style.visibility='visible';
    }catch(e){fail(e);}
  },{once:true});
})();
</script>
</body>
</html>
