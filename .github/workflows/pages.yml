name: Deploy Pages

# Deploy normal em push e fallback periódico para sincronizações feitas por automação externa.
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar artefato do painel
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp status.json public/status.json
          cp status_areas.js public/status_areas.js
          cp status_sequence.js public/status_sequence.js

      - name: Regressão do contrato do artefato
        run: python3 tests/test_contrato_artefato.py

      - name: Validar contrato do artefato publicado
        run: |
          node --check public/status_areas.js
          node --check public/status_sequence.js
          python3 scripts/validar_contrato_artefato.py public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
