name: Deploy Pages

# Deploy normal em push e fallback periódico para sincronizações feitas por automação externa.
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar artefato do painel
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp status.json public/status.json
          cp status_areas.js public/status_areas.js
          cp status_sequence.js public/status_sequence.js

      - name: Validar contrato do artefato publicado
        run: |
          node --check public/status_areas.js
          node --check public/status_sequence.js
          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          public = Path("public")
          html = (public / "index.html").read_text(encoding="utf-8")
          json.loads((public / "status.json").read_text(encoding="utf-8"))

          refs = re.findall(r'<script\s+src="([^"?]+)(?:\?[^\"]*)?"></script>', html, flags=re.I)
          locais = [ref for ref in refs if not ref.startswith(("http://", "https://", "//"))]
          faltantes = [ref for ref in locais if not (public / ref).is_file()]
          if faltantes:
              raise SystemExit("Assets locais referenciados mas ausentes do artefato: " + ", ".join(faltantes))

          esperados = {"status_areas.js", "status_sequence.js"}
          if not esperados.issubset(set(locais)):
              raise SystemExit("index.html não referencia todos os scripts obrigatórios: " + ", ".join(sorted(esperados)))

          if html.count("status_areas.js") != 1 or html.count("status_sequence.js") != 1:
              raise SystemExit("Scripts do painel devem ser referenciados exatamente uma vez no index.html")

          if html.index("status_areas.js") > html.index("status_sequence.js"):
              raise SystemExit("status_areas.js deve carregar antes de status_sequence.js")

          print("SIMETTRIA_STATUS_PAGES_ASSET_CONTRACT_OK")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
